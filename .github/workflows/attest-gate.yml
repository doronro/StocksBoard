# ────────────────────────────────────────────────────────────────────────────
# Attest — compliance PR gate  (advisory · non-blocking)
# Frameworks: 21st Century Cures Act — Information Blocking / ONC API, CFPB Personal Financial Data Rights (§1033), CSA Cloud Controls Matrix
# Project: Stock Board
# Trigger: pull requests labelled 'attest' (re-add to re-run) + a baseline scan on every push to main/master.
#
# Drop this file into .github/workflows/ and commit it to your default branch.
# Each framework posts its own PR comment.
#
# BASELINE: the gate scans your base branch on each push to main/master, so a PR
# can show ONLY what it changed (fixed / newly introduced) — not your whole backlog.
# If your default branch isn't main or master, edit the "push: branches" list below.
#
# SECURITY: this file contains your Attest gate token below. That is fine for a
# PRIVATE repository. For a PUBLIC repository, create an Actions secret named
# ATTEST_TOKEN (Settings → Secrets and variables → Actions) and replace the token
# value below with: ${{ secrets.ATTEST_TOKEN }}
# ────────────────────────────────────────────────────────────────────────────
name: Attest compliance check
on:
  pull_request:
    types: [labeled]
  push:
    branches: [main, master]

permissions:
  pull-requests: write
  contents: read

jobs:
  attest:
    if: github.event_name == 'push' || github.event.label.name == 'attest'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One framework at a time: each scan is a full repo read, so serializing keeps them
      # from starving each other. Raise this once the backend has more headroom.
      max-parallel: 1
      matrix:
        framework: [onc-cures, cfpb-1033, csa-ccm]
    steps:
      - name: Run Attest compliance gate
        env:
          ATTEST_TOKEN: ${{ secrets.ATTEST_TOKEN }}
          ATTEST_API: "https://agentsincorporated.ai/api"
          FRAMEWORK: ${{ matrix.framework }}
          PROJECT_ID: "e0b97ce3-2299-4b3e-a77a-8660fd940986"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Baseline pass: on a push to the base branch (a merge), scan it so future PRs have a
          # reference to diff against. There's no PR here — just record the baseline, no comment.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Attest: baseline scan for $GITHUB_REF_NAME ($FRAMEWORK)…"
            curl -sS -X POST "$ATTEST_API/gate/scan" \
              -H "X-Attest-Token: $ATTEST_TOKEN" -H "Content-Type: application/json" \
              -d "{\"framework\":\"$FRAMEWORK\",\"projectId\":\"$PROJECT_ID\",\"headRef\":\"$GITHUB_REF_NAME\",\"headSha\":\"$GITHUB_SHA\",\"baseRef\":\"$GITHUB_REF_NAME\"}" >/dev/null \
              && echo "Attest: baseline scan started for $GITHUB_REF_NAME (no PR comment)."
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          REPO="${{ github.repository }}"

          echo "Attest: starting scan for PR #$PR ($FRAMEWORK)…"
          START=$(curl -sS -X POST "$ATTEST_API/gate/scan" \
            -H "X-Attest-Token: $ATTEST_TOKEN" -H "Content-Type: application/json" \
            -d "{\"framework\":\"$FRAMEWORK\",\"projectId\":\"$PROJECT_ID\",\"headRef\":\"$HEAD_REF\",\"headSha\":\"$HEAD_SHA\",\"baseRef\":\"$BASE_REF\",\"prNumber\":$PR}")
          SCAN_ID=$(echo "$START" | jq -r '.scanId // empty')
          if [ -z "$SCAN_ID" ]; then echo "Attest: could not start scan (non-blocking): $START"; exit 0; fi

          echo "Attest: scan $SCAN_ID running; waiting for results…"
          RES=""; STATUS=""
          for i in $(seq 1 138); do   # ~23 min, covers the 20-min server-side AI ceiling
            sleep 10
            RES=$(curl -sS "$ATTEST_API/gate/scan/$SCAN_ID" -H "X-Attest-Token: $ATTEST_TOKEN")
            [ "$(echo "$RES" | jq -r '.completed // false')" = "true" ] && break
            STATUS=$(echo "$RES" | jq -r '.status // ""')
            case "$STATUS" in Failed|Cancelled|Stopped) break;; esac
          done

          BODY=$(echo "$RES" | jq -r '.commentMarkdown // empty')
          if [ -z "$BODY" ]; then
            ERR=$(echo "$RES" | jq -r '.error // "The scan did not finish in time."')
            echo "Attest: scan did not complete — $ERR"
            BODY=$(printf '## 🛡️ Attest — %s compliance check\n\n> ⚠️ The scan could not complete: %s\n\n<sub>Advisory · Attest · this comment updates on the next run.</sub>\n<!-- attest-gate:%s -->' "$FRAMEWORK" "$ERR" "$FRAMEWORK")
          fi

          MARKER="<!-- attest-gate:$FRAMEWORK -->"
          printf '%s' "$BODY" > /tmp/attest-comment.md
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@/tmp/attest-comment.md >/dev/null \
              && echo "Attest: updated existing comment."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@/tmp/attest-comment.md >/dev/null \
              && echo "Attest: posted comment."
          fi
          echo "Attest: gate complete (advisory)."